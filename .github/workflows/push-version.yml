name: Push Version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump (format: X.Y.Z or X.Y.Z-rc.1)"
        required: true
        type: string
      build:
        description: "Optional build number override (positive integer)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    if: "${{ (github.event_name == 'workflow_dispatch') || (contains(toJson(github.event.commits), 'push-ver:') && contains(toJson(github.event.commits), 'ci: version bump') == false) }}"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      build: ${{ steps.bump.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump versions
        id: bump
        env:
          COMMIT_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && format('push-ver:{0}{1}', github.event.inputs.version, github.event.inputs.build != '' && format(' push-build:{0}', github.event.inputs.build) || '') || github.event.head_commit.message }}
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
        run: node scripts/ci/push-version.js

      - name: Commit and tag
        if: ${{ steps.bump.outputs.version != '' }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json packages/*/package.json packages/mobile-front-v2/app.json \
            packages/mobile-front-v2/android/app/build.gradle \
            packages/mobile-front-v2/ios/ChromaMobileStore/Info.plist \
            packages/mobile-front-v2/ios/ChromaMobileStore.xcodeproj/project.pbxproj

          git commit -m "ci: version bump v${{ steps.bump.outputs.version }} (build ${{ steps.bump.outputs.build }}) [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}+build.${{ steps.bump.outputs.build }}"
          git push --follow-tags

      - name: Create GitHub Release
        if: ${{ steps.bump.outputs.version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}+build.${{ steps.bump.outputs.build }}
          name: v${{ steps.bump.outputs.version }} (build ${{ steps.bump.outputs.build }})
          body: |
            Release triggered by commit:
            ${{ github.event_name == 'workflow_dispatch' && format('workflow_dispatch (version {0})', github.event.inputs.version) || github.event.head_commit.message }}

  mobile-deploy:
    if: ${{ needs.bump.outputs.version != '' }}
    needs: bump
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile-front-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}+build.${{ needs.bump.outputs.build }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (iOS)
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Submit (iOS)
        run: eas submit --platform ios --profile production --non-interactive --latest
